name: vestlly
description: "An investment tracking and automation platform."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0-296.4.beta

dependencies:
  animated_snack_bar: ^0.4.0
  flutter:
    sdk: flutter
  flutter_spinkit: ^5.2.2
  http: ^1.6.0
  intl: ^0.20.2
  provider: ^6.1.5+1
  shared_preferences: ^2.5.4
  sqflite: ^2.4.2
  flutter_staggered_grid_view: ^0.7.0
  fl_chart: ^0.69.0
  animated_bottom_navigation_bar: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_icons:
  android: true
  ios: true
  adaptive_icon_background: "#16161D"
  adaptive_icon_foreground: "assets/icon.png"
  image_path: "assets/icon.png"

flutter:
  uses-material-design: true
  
  assets:
    - assets/

  fonts:
    - family: Inter
      fonts:
      - asset: fonts/Inter.ttf
